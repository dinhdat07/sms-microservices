services:
  # ============================================
  # Traefik API Gateway
  # ============================================
  traefik:
    image: traefik:latest
    container_name: sms_traefik
    user: root
    restart: unless-stopped
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://host.docker.internal:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik Dashboard
    environment:
      - DOCKER_API_VERSION=1.44
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    networks:
      - default

  # ============================================
  # SMS Identity Service
  # ============================================
  sms-identity:
    build:
      context: ./sms-identity
      dockerfile: Dockerfile
    container_name: sms_identity
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=development
      - DB_URL=postgresql://postgres:postgres@postgres:5432/sms?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - HTTP_PORT=8000
      - GRPC_PORT=50051
      - ADMIN_EMAIL=admin@demo.com
      - ADMIN_PASSWORD=admin
      - USER_EMAIL=user@example.com
      - USER_PASSWORD=user
    labels:
      - "traefik.enable=true"
      # Route for Authentication APIs
      - "traefik.http.routers.identity.rule=PathPrefix(`/api/v1/auth/`)"
      - "traefik.http.routers.identity.entrypoints=web"
      - "traefik.http.services.identity.loadbalancer.server.port=8000"
      # Route for OpenAPI (no auth required)
      - "traefik.http.routers.identity-openapi.rule=PathPrefix(`/openapi/auth/`)"
      - "traefik.http.routers.identity-openapi.entrypoints=web"
      - "traefik.http.routers.identity-openapi.service=identity"
      # Define ForwardAuth Middleware
      - "traefik.http.middlewares.sms-auth.forwardauth.address=http://sms_identity:8000/verify"
      - "traefik.http.middlewares.sms-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.sms-auth.forwardauth.authRequestHeaders=X-Csrf-Token,Cookie,Authorization"
      - "traefik.http.middlewares.sms-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Role,X-User-Email,X-User-Name"
    networks:
      - default

  # ============================================
  # SMS Management Service
  # ============================================
  sms-management:
    build:
      context: ./sms-management
      dockerfile: Dockerfile
    container_name: sms_management
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV=development
      - DB_URL=postgresql://postgres:postgres@postgres:5432/sms?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - HTTP_PORT=8001
      - GRPC_PORT=50052
      - OUTBOX_STREAM_MAXLEN=1000000
      - MASTER_KEY=0123456789abcdef0123456789abcdef
    labels:
      - "traefik.enable=true"
      # Route for Management APIs
      - "traefik.http.routers.management.rule=PathPrefix(`/api/v1/servers`)"
      - "traefik.http.routers.management.entrypoints=web"
      - "traefik.http.services.management.loadbalancer.server.port=8001"
      # Apply ForwardAuth Middleware (from sms-identity)
      - "traefik.http.routers.management.middlewares=sms-auth@docker"
      # Route for OpenAPI (no auth required)
      - "traefik.http.routers.management-openapi.rule=PathPrefix(`/openapi/server_management/`)"
      - "traefik.http.routers.management-openapi.entrypoints=web"
      - "traefik.http.routers.management-openapi.service=management"
    networks:
      - default

  # ============================================
  # PostgreSQL — Single Source of Truth
  # ============================================
  postgres:
    image: postgres:15
    container_name: sms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sms
    ports:
      - "15432:5432"
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis — Cache & Distributed Lock
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Elasticsearch — Time-Series Observation Store
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: sms_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - sms_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q -E 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================
  # MailHog — Email testing (SMTP + Web UI)
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sms_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (http://localhost:8025)

  # ============================================
  # Server Simulator — Virtual IPs + nftables
  # ============================================
  simulator:
    build:
      context: ./sms-simulator
    container_name: sms_simulator
    restart: unless-stopped
    ports:
      - "8081:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SIMULATOR_IP_COUNT: "10000"
      SIMULATOR_SUBNET: "10.1"
      SIMULATOR_AUTO_FLAP_ENABLED: "true"
      SIMULATOR_FLAP_INTERVAL: "60s"
      SIMULATOR_FLAP_PERCENT: "5"
    networks:
      - default

  # ============================================
  # Monitoring Worker — runs in Docker network so ICMP can reach simulator IPs
  # ============================================
  sms-monitoring-worker:
    build:
      context: ./sms-monitoring
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      simulator:
        condition: service_started
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sms?sslmode=disable
      REDIS_ENABLED: "true"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_SERVER_INDEX: sms_observation_logs
      ICMP_PRIVILEGED: "false"
      MONITORING_FAILURE_THRESHOLD: "1"
      MONITORING_WORKER_CONCURRENCY: "500"
      MONITORING_ICMP_TIMEOUT: 3s
      MONITORING_SSH_TIMEOUT: 10s
      MONITORING_AGENT_PULL_TIMEOUT: 10s
      MONITORING_AGENT_PUSH_TTL: 60
      MONITORING_SWEEPER_INTERVAL: 10s
      MONITORING_WORKER_TICK_INTERVAL: 60s
      MONITORING_WORKER_LOCK_KEY: lock:monitoring_worker
      MONITORING_WORKER_LOCK_EXPIRATION: 50s
      MASTER_KEY: 0123456789abcdef0123456789abcdef
      SIMULATOR_HOST: simulator
      SIMULATOR_SUBNET: 10.1.0.0/16
      STREAM_MAXLEN: "1000000"
      LOG_LEVEL: info
      LOG_FORMAT: text
    networks:
      - default

  # ============================================
  # SMS Agent Handler — Receives push events
  # ============================================
  sms-agent-handler:
    build:
      context: ./sms-agent-handler
      dockerfile: Dockerfile
    container_name: sms_agent_handler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=8084
      - REDIS_URI=redis://redis:6379/0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/api/v1/agent`)"
      - "traefik.http.routers.agent.entrypoints=web"
      - "traefik.http.services.agent.loadbalancer.server.port=8084"
    networks:
      - default

  # ============================================
  # SMS Reporting Service
  # ============================================
  sms-reporting:
    build:
      context: ./sms-reporting
      dockerfile: Dockerfile
    container_name: sms_reporting
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      - ENV=development
      - DB_URL=postgresql://postgres:postgres@postgres:5432/sms?sslmode=disable
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_SERVER_INDEX=sms_observation_logs
      - NOTIFICATION_STREAM=notification_events
      - HTTP_PORT=8002
      - GRPC_PORT=50053
      - CONSUMER_NAME=reporting_worker
    labels:
      - "traefik.enable=true"
      # Route for Reporting APIs
      - "traefik.http.routers.reporting.rule=PathPrefix(`/api/v1/servers/report`)"
      - "traefik.http.routers.reporting.entrypoints=web"
      - "traefik.http.routers.reporting.priority=200"
      - "traefik.http.services.reporting.loadbalancer.server.port=8002"
      # Apply ForwardAuth Middleware (from sms-identity)
      - "traefik.http.routers.reporting.middlewares=sms-auth@docker"
      # Route for OpenAPI (no auth required)
      - "traefik.http.routers.reporting-openapi.rule=PathPrefix(`/openapi/reporting/`)"
      - "traefik.http.routers.reporting-openapi.entrypoints=web"
      - "traefik.http.routers.reporting-openapi.priority=200"
      - "traefik.http.routers.reporting-openapi.service=reporting"
    networks:
      - default

  # ============================================
  # SMS Notification Service
  # ============================================
  sms-notification:
    build:
      context: ./sms-notification
      dockerfile: Dockerfile
    container_name: sms_notification
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      - ENV=development
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - NOTIFICATION_STREAM=notification_events
      - NOTIFICATION_GROUP=notification_workers
      - CONSUMER_NAME=notification_worker_1
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USE_AUTH=false
      - SMTP_USE_TLS=false
      - SMTP_FROM=reports@sms.local
      - SMTP_FROM_NAME=SMS Monitoring
      - LOG_LEVEL=info
      - LOG_FORMAT=text
    networks:
      - default

  # ============================================
  # SMS Frontend Service
  # ============================================
  sms-frontend:
    image: whaleplay710/sms-frontend:v1.0.0
    container_name: sms_frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Route all traffic to frontend by default
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
    networks:
      - default

volumes:
  sms_postgres_data:
  sms_es_data:
