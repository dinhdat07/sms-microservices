x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    logging: *default-logging
    image: traefik:latest
    user: root
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --providers.swarm=true
      - --providers.swarm.network=sms_default
      - --entrypoints.web.address=:80
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
    ports:
      - 80:80
      - 8080:8080
    environment:
      - DOCKER_API_VERSION=1.44
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      placement:
        constraints:
          - node.role == manager

  sms-identity:
    logging: *default-logging
    environment:
      - ENV=development
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - HTTP_PORT=8000
      - GRPC_PORT=50051
      - ADMIN_EMAIL=admin@example.com
      - USER_EMAIL=user@example.com
      - USER_PASSWORD_FILE=/run/secrets/user_password
      - DB_URL_FILE=/run/secrets/db_url
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    networks:
      - default
    image: whaleplay710/sms-identity:v1.0.0
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.identity.rule=PathPrefix(`/api/v1/auth/`) || PathPrefix(`/openapi/auth/`)
        - traefik.http.routers.identity.entrypoints=web
        - traefik.http.middlewares.sms-ratelimit.ratelimit.average=100
        - traefik.http.middlewares.sms-ratelimit.ratelimit.burst=50
        - traefik.http.routers.identity.middlewares=sms-ratelimit
        - traefik.http.services.identity.loadbalancer.server.port=8000
        - >-
          traefik.http.middlewares.sms-auth.forwardauth.address=http://sms-identity:8000/verify
        - traefik.http.middlewares.sms-auth.forwardauth.trustForwardHeader=true
        - >-
          traefik.http.middlewares.sms-auth.forwardauth.authRequestHeaders=X-Csrf-Token,Cookie,Authorization
        - >-
          traefik.http.middlewares.sms-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Role,X-User-Email,X-User-Name
        - traefik.http.routers.identity-health.rule=PathPrefix(`/health/identity`)
        - traefik.http.routers.identity-health.entrypoints=web
        - traefik.http.routers.identity-health.service=identity
        - traefik.http.routers.identity-health.middlewares=sms-ratelimit,identity-health-replace
        - traefik.http.middlewares.identity-health-replace.replacepath.path=/health
    secrets:
      - db_url
      - admin_password
      - user_password
      - jwt_secret

  sms-management:
    logging: *default-logging
    environment:
      - ENV=development
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - HTTP_PORT=8001
      - GRPC_PORT=50052
      - DB_URL_FILE=/run/secrets/db_url
    networks:
      - default
    image: whaleplay710/sms-management:v1.0.0
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.management.rule=PathPrefix(`/api/v1/servers`)
        - traefik.http.routers.management.entrypoints=web
        - traefik.http.routers.management.middlewares=sms-auth,sms-ratelimit
        - traefik.http.routers.management.service=management-svc
        - traefik.http.routers.management-openapi.rule=PathPrefix(`/openapi/server_management/`)
        - traefik.http.routers.management-openapi.entrypoints=web
        - traefik.http.routers.management-openapi.middlewares=sms-ratelimit
        - traefik.http.routers.management-openapi.service=management-svc
        - traefik.http.services.management-svc.loadbalancer.server.port=8001
        - traefik.http.routers.management-health.rule=PathPrefix(`/health/management`)
        - traefik.http.routers.management-health.entrypoints=web
        - traefik.http.routers.management-health.service=management-svc
        - traefik.http.routers.management-health.middlewares=sms-ratelimit,management-health-replace
        - traefik.http.middlewares.management-health-replace.replacepath.path=/health
    secrets:
      - db_url

  postgres:
    logging: *default-logging
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: sms
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - 15432:5432
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password
    deploy:
      placement:
        constraints:
          - node.hostname == node-3

  redis:
    logging: *default-logging
    image: redis:7-alpine
    command: 
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--aof-use-rdb-preamble"
      - "yes"
      - "--save"
      - "900 1"
      - "--save"
      - "300 10"
      - "--save"
      - "60 10000"
    ports:
      - 6379:6379
    volumes:
      - sms_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.hostname == node-3

  elasticsearch:
    logging: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - sms_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s http://localhost:9200/_cluster/health | grep -q -E
          'green|yellow'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      placement:
        constraints:
          - node.hostname == node-3
  
  sms-seeder:
    image: whaleplay710/sms-simulator:v1.0.0
    networks:
      - default
    environment:
      - REDIS_ADDR=redis:6379
    entrypoint: ["/bin/sh", "-c", "export DB_URL=$$(cat /run/secrets/db_url) && ./server-seed"]
    secrets:
      - db_url
    deploy:
      restart_policy:
        condition: none 


  mailhog:
    logging: *default-logging
    image: mailhog/mailhog:latest
    ports:
      - 1025:1025
      - 8025:8025

  simulator:
    logging: *default-logging
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      SIMULATOR_IP_COUNT: '10000'
      SIMULATOR_SUBNET: '10.1'
      SIMULATOR_AUTO_FLAP_ENABLED: 'true'
      SIMULATOR_FLAP_INTERVAL: 60s
      SIMULATOR_FLAP_PERCENT: '5'
    networks:
      - default
    image: whaleplay710/sms-simulator:v1.0.0
    deploy:
      endpoint_mode: dnsrr

  sms-monitoring-worker:
    logging: *default-logging
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ENV=development
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_SERVER_INDEX=sms_observation_logs
      - MONITORING_FAILURE_THRESHOLD=2
      - MONITORING_WORKER_CONCURRENCY=500
      - MONITORING_WORKER_PING_TIMEOUT=3s
      - MONITORING_WORKER_TICK_INTERVAL=30s
      - MONITORING_WORKER_LOCK_KEY=lock:monitoring_worker
      - MONITORING_WORKER_LOCK_EXPIRATION=25s
      - SIMULATOR_HOST=simulator
      - SIMULATOR_SUBNET=10.1.0.0/16
      - LOG_LEVEL=info
      - LOG_FORMAT=text
      - DB_URL_FILE=/run/secrets/db_url
    networks:
      - default
    image: whaleplay710/sms-monitoring-worker:v1.0.0
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    secrets:
      - db_url

  sms-reporting:
    logging: *default-logging
    environment:
      - ENV=development
      - REDIS_ENABLED=true
      - REDIS_ADDR=redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_SERVER_INDEX=sms_observation_logs
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USE_AUTH=false
      - SMTP_USE_TLS=false
      - SMTP_FROM=reports@sms.local
      - HTTP_PORT=8002
      - GRPC_PORT=50053
      - CONSUMER_NAME=reporting_worker
      - DB_URL_FILE=/run/secrets/db_url
      - REPORTING_WORKER_COUNT=20
      - REPORTING_JOB_QUEUE_SIZE=5000
    networks:
      - default
    image: whaleplay710/sms-reporting:v1.0.0
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.reporting.rule=PathPrefix(`/api/v1/servers/report`)
        - traefik.http.routers.reporting.entrypoints=web
        - traefik.http.routers.reporting.middlewares=sms-auth,sms-ratelimit
        - traefik.http.routers.reporting.service=reporting-svc
        - traefik.http.routers.reporting-openapi.rule=PathPrefix(`/openapi/reporting/`)
        - traefik.http.routers.reporting-openapi.entrypoints=web
        - traefik.http.routers.reporting-openapi.middlewares=sms-ratelimit
        - traefik.http.routers.reporting-openapi.service=reporting-svc
        - traefik.http.routers.reporting.priority=200
        - traefik.http.routers.reporting-openapi.priority=200
        - traefik.http.services.reporting-svc.loadbalancer.server.port=8002
        - traefik.http.routers.reporting-health.rule=PathPrefix(`/health/reporting`)
        - traefik.http.routers.reporting-health.entrypoints=web
        - traefik.http.routers.reporting-health.service=reporting-svc
        - traefik.http.routers.reporting-health.middlewares=sms-ratelimit,reporting-health-replace
        - traefik.http.middlewares.reporting-health-replace.replacepath.path=/health
    secrets:
      - db_url

  sms-frontend:
    logging: *default-logging
    networks:
      - default
    image: whaleplay710/sms-frontend:v1.0.0
    deploy:
      replicas: 2
      labels:
        - traefik.enable=true
        - traefik.http.routers.frontend.rule=PathPrefix(`/`)
        - traefik.http.routers.frontend.entrypoints=web
        - traefik.http.services.frontend.loadbalancer.server.port=8080

  swagger-ui:
    logging: *default-logging
    image: swaggerapi/swagger-ui:latest
    environment:
      - BASE_URL=/docs
      - URLS=[{url:"/openapi/auth/v1/auth.swagger.json",name:"Identity API"},{url:"/openapi/server_management/v1/server.swagger.json",name:"Management API"},{url:"/openapi/reporting/v1/reporting.swagger.json",name:"Reporting API"}]
    networks:
      - default
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.swagger.rule=PathPrefix(`/docs`)
        - traefik.http.routers.swagger.entrypoints=web
        - traefik.http.services.swagger.loadbalancer.server.port=8080

volumes:
  sms_postgres_data: null
  sms_es_data: null
  sms_redis_data: null

networks:
  default:
    driver: overlay
    attachable: true

secrets:
  postgres_password:
    external: true
  admin_password:
    external: true
  db_url:
    external: true
  jwt_secret:
    external: true
  user_password:
    external: true